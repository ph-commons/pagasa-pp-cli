version: 2
project_name: pagasa-pp-cli
changelog:
  disable: true
builds:
  - id: pagasa-pp-cli
    main: ./cmd/pagasa-pp-cli
    binary: pagasa-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/ph-commons/pagasa-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: pagasa-pp-mcp
    main: ./cmd/pagasa-pp-mcp
    binary: pagasa-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      # MCP uses cli.Version() (single source); same -X as the CLI binary.
      - -s -w -X github.com/ph-commons/pagasa-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
